<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$symbol | Fixed grid backtest</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14243b;
      --muted: #53657b;
      --line: #dce4ec;
      --accent: #1957ad;
      font: 15px/1.5 Inter, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; color: var(--ink); }
    main { width: min(1220px, calc(100% - 48px)); margin: 0 auto; padding: 44px 0 56px; }
    h1, h2, dl, dd { margin: 0; }
    h1 { font-size: clamp(1.65rem, 4vw, 2.6rem); line-height: 1.12; letter-spacing: -.04em; }
    h2 { font-size: 1.2rem; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 172px), 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .metric { min-width: 0; padding: 14px 15px; background: #fff; border: 1px solid var(--line); border-radius: 9px; }
    dt { color: var(--muted); font-size: .85rem; }
    dd { margin-top: 4px; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
    .panel { margin-top: 16px; padding: 19px 20px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .scroll { overflow-x: auto; margin-top: 12px; }
    .scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    table, dd { font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th { background: #f3f6fa; color: #344961; font-size: .84rem; font-weight: 650; }
    th:first-child, td:first-child { text-align: left; }
    .heatmap { border-collapse: separate; border-spacing: 3px; }
    .heatmap th, .heatmap td { border: 0; border-radius: 4px; text-align: center; }
    .heatmap td[title] { cursor: help; }
    .heatmap .best { box-shadow: inset 0 0 0 2px var(--ink); font-weight: 750; }
    .unavailable { background: #eceff3; }
    @media (max-width: 520px) {
      main { width: calc(100% - 24px); padding-top: 24px; }
      .panel { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>$symbol Fixed Grid Backtest</h1>
    <dl class="metrics" aria-label="Backtest summary">$metrics</dl>
    $details
  </main>
</body>
</html>
